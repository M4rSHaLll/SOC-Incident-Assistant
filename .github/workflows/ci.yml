name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: test
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    container: python:3.12-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-linux-python312-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: python -m pip install '.[dev]'
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy app

  unit:
    needs: lint
    runs-on: ubuntu-24.04
    container: python:3.12-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-linux-python312-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: python -m pip install '.[dev]'
      - name: Unit and API tests
        run: python -m pytest -m "not integration" -v

  integration:
    needs: lint
    runs-on: ubuntu-24.04
    container: python:3.12-slim
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          # Disposable CI database credentials, not production secrets.
          POSTGRES_DB: soc_assistant_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d soc_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/soc_assistant
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/soc_assistant_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-linux-python312-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: python -m pip install '.[dev]'
      - name: Migrate test database
        # Keep the application's DATABASE_URL distinct when pytest runs.
        run: DATABASE_URL="$TEST_DATABASE_URL" python -m alembic upgrade head
      - name: Integration tests
        run: python -m pytest -m integration -v
